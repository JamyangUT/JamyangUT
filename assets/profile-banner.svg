<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Biomedical science and computational biology</title>
  <desc id="desc">A black and white personal research banner with an abstract DNA helix and molecular network, representing neuroscience, molecular biology, and biotechnology.</desc>
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="60%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
